global:
  scrape_interval: 5s # Scrape often for real-time demo updates
 
scrape_configs:
  # 1. Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
 
  # 2. Scrape Windows Exporter (Your PC Stats)
  - job_name: 'windows'
    static_configs:
      - targets: ['host.docker.internal:9182']
 
  # 3. Scrape AI Service (Python App)
  # UPDATED TO PORT 5001
  - job_name: 'ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5001']