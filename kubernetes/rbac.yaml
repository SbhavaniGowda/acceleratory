apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: accelerator-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-read-role
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-read-binding
subjects:
- kind: ServiceAccount
  name: prometheus-sa
  namespace: accelerator-ops
roleRef:
  kind: ClusterRole
  name: prometheus-read-role
  apiGroup: rbac.authorization.k8s.io
