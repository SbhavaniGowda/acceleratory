apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: accelerator-ops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'ai-service'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: ai-service
          action: keep
